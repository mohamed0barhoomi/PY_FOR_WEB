<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter une expédition</title>
</head>
<body>

    <h1>
        {% if object %}
         Update EXpedition {{ object.reference }}
       {% else %}
        Ajouter une expédition
           {% endif %}
    </h1>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Enregistrer</button>
    </form>

    <br>

    <a href="{% url 'expedition:liste_class' %}">Retour à la liste</a>

</body>
</html>
