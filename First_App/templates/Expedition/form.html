<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% if object %}
            Modifier une expédition
        {% else %}
            Ajouter une expédition
        {% endif %}
    </title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            color: #1e293b;
            font-size: 27px;
            margin-bottom: 30px;
        }

        h1::after {
            content: "";
            display: block;
            width: 65px;
            height: 4px;
            background: #4f46e5;
            margin: 12px auto 0;
            border-radius: 5px;
        }

        form p {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            color: #334155;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 15px;
            color: #1e293b;
            background: #f8fafc;
            outline: none;
            transition: 0.3s;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #4f46e5;
            background: white;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
        }

        .helptext {
            display: block;
            font-size: 12px;
            color: #64748b;
            margin-top: 5px;
        }

        ul.errorlist {
            list-style: none;
            color: #dc2626;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        button,
        .back-btn {
            flex: 1;
            padding: 13px;
            border-radius: 9px;
            font-size: 15px;
            font-weight: 600;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            transition: 0.3s;
        }

        button {
            border: none;
            background: #4f46e5;
            color: white;
        }

        button:hover {
            background: #3730a3;
            transform: translateY(-2px);
        }

        .back-btn {
            background: #f1f5f9;
            color: #334155;
            border: 1px solid #cbd5e1;
        }

        .back-btn:hover {
            background: #e2e8f0;
        }

        @media (max-width: 500px) {
            .container {
                padding: 25px 20px;
            }

            h1 {
                font-size: 22px;
            }

            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>
            {% if object %}
                Modifier l'expédition {{ object.reference }}
            {% else %}
                Ajouter une expédition
            {% endif %}
        </h1>

        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <div class="buttons">

                <button type="submit">
                    {% if object %}
                        Modifier l'expédition
                    {% else %}
                        Enregistrer
                    {% endif %}
                </button>

                <a href="{% url 'expedition:liste_class' %}" class="back-btn">
                    Retour à la liste
                </a>

            </div>
        </form>

    </div>

</body>
</html>
